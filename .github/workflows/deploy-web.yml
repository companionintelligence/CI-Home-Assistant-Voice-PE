name: Deploy ha.ci.computer

# Publishes web/ as the Cloudflare Worker `ci-ha-voice-setup` on the custom
# domain ha.ci.computer. Runs when web/ changes on main (about a minute), or
# on demand:
#   gh workflow run deploy-web.yml --repo companionintelligence/CI-Home-Assistant-Voice-PE --ref main
#
# Needs repository (or organization) secrets:
#   CLOUDFLARE_API_TOKEN   from the "Edit Cloudflare Workers" token template,
#                          with the ci.computer zone included
#   CLOUDFLARE_ACCOUNT_ID  the Companion Intelligence Cloudflare account
# Without them the job skips with a notice instead of failing, so deploying
# from the Cloudflare dashboard (Workers Builds) works on its own too.
# See web/README.md.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ha.ci.computer
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, or deploy from the Cloudflare dashboard (see web/README.md)."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://ha.ci.computer/ | grep -q "Companion Voice for Home Assistant"; then
              curl -fsS https://ha.ci.computer/compose.yml | grep -q "ci-ha-voice-bridge" && echo "ha.ci.computer is live" && exit 0
            fi
            sleep 10
          done
          echo "::warning::ha.ci.computer did not answer yet; a new custom domain certificate can take a few minutes"
