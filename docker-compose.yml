version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ci_voice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama (local LLM) ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── ci-server (OpenAI-compatible façade) ────────────────────────────────────
  ci-server:
    build:
      context: ./ci-server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/ci_voice}
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
      MASTER_API_KEY: ${MASTER_API_KEY:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Voice Bridge (Wyoming ↔ ci-server relay) ─────────────────────────────────
  voice-bridge:
    build:
      context: ./voice-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      ci-server:
        condition: service_healthy
    environment:
      CI_SERVER_URL: http://ci-server:8080
      CI_SERVER_API_KEY: ${MASTER_API_KEY:-change-me-in-production}
      CI_MODEL: ${CI_MODEL:-ollama:llama2}
      VOICE_BRIDGE_HOST: 0.0.0.0
      VOICE_BRIDGE_PORT: 10700
      SAMPLE_RATE: 16000
      SYSTEM_INSTRUCTIONS: >
        You are a concise smart home voice assistant. Answer in 1-2 sentences.
    ports:
      - "10700:10700"

volumes:
  postgres_data:
  ollama_models:
